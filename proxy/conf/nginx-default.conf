server_tokens off;

# The proxy is only reached through the cluster's ingress controller, so the
# connecting address is the controller's, shared by every visitor. Take the
# visitor's address from X-Forwarded-For instead, trusting private ranges only,
# so the rate limit below applies per visitor rather than to everyone at once.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 10 requests per minute per visitor (up to 10 at once).
limit_req_zone $binary_remote_addr zone=all_req_limit:10m rate=10r/m;

server {
  listen  8080;

  error_page 503 /rate-limit.html;

  # Serve static files directly
  location = /healthz {
    access_log off;
    return  204;
  }

  # Rate-limiter landing page
  location = /rate-limit.html {
      root /usr/share/nginx/html;
      internal;
  }
  
  # Proxy /status without rate limiting
  location = /status {
    proxy_pass http://${PLACEHOLDER_SERVICE_NAME}.${PLACEHOLDER_SERVICE_NAMESPACE}/;
    proxy_redirect             off;
    proxy_set_header           Host             $host;
    proxy_set_header           X-Real-IP        $remote_addr;
    proxy_set_header           X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto $scheme;
    proxy_set_header           X-Forwarded-Port  $server_port;
  }

  # Proxy all other requests with rate limiting
  location / {

    limit_req zone=all_req_limit burst=10 nodelay;

    # Pass the request on to upscaler service.
    proxy_pass http://${PLACEHOLDER_SERVICE_NAME}.${PLACEHOLDER_SERVICE_NAMESPACE}/;
    proxy_redirect             off;
    proxy_set_header           Host             $host;
    proxy_set_header           X-Real-IP        $remote_addr;
    proxy_set_header           X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto $scheme;
    proxy_set_header           X-Forwarded-Port  $server_port;
    # add_header              Front-End-Https   on;
  }
}
